<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小希的个人网站</title>
<meta name="description" content="小希的个人网站：记录生活、学习和爱好。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f8f9fa;color:#333;line-height:1.6;padding-bottom:40px}
.navbar{background:#fff;border-bottom:1px solid #e9ecef;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.nav-container{max-width:800px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-size:18px;font-weight:600;color:#2563eb;text-decoration:none}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{text-decoration:none;color:#666;font-size:14px;transition:color .2s}
.nav-links a:hover{color:#2563eb}
.menu-toggle{display:none;background:none;border:none;color:#333;font-size:24px;cursor:pointer}
.main{max-width:800px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;padding:60px 20px 40px}
.hero img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid #e5e7eb}
.hero h1{font-size:28px;color:#1f2937;margin-bottom:8px;font-weight:700}
.hero .subtitle{font-size:15px;color:#6b7280;margin-bottom:20px}
.clock-big{font-size:36px;font-weight:600;color:#2563eb;margin:16px 0;letter-spacing:2px}
.clock-date{font-size:14px;color:#9ca3af;margin-bottom:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:28px;margin-bottom:20px}
.card h2{font-size:17px;color:#1f2937;margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card p{color:#4b5563;font-size:14px;line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{padding:5px 14px;background:#eff6ff;color:#2563eb;border-radius:16px;font-size:13px}
.link-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.link-item{display:flex;align-items:center;gap:8px;padding:12px;background:#f9fafb;border-radius:8px;text-decoration:none;color:#374151;transition:background .2s;font-size:13px}
.link-item:hover{background:#eff6ff}
.link-item .icon{font-size:18px}
input,textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px;outline:none;background:#fff;color:#333}
input:focus,textarea:focus{border-color:#2563eb}
textarea{min-height:80px}
.btn{background:#2563eb;color:#fff;padding:10px 22px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.btn:hover{background:#1d4ed8}
.list-item{background:#f9fafb;border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid #2563eb}
.list-item .date{color:#2563eb;font-size:12px;font-weight:500;margin-bottom:4px}
.list-item .text{color:#4b5563;font-size:14px}
.todo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6}
.todo-row:last-child{border-bottom:none}
.todo-row input[type=checkbox]{width:16px;height:16px;accent-color:#2563eb;cursor:pointer}
.todo-text{flex:1;font-size:14px;color:#374151}
.todo-done .todo-text{text-decoration:line-through;color:#9ca3af}
.todo-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px}
.fab{position:fixed;width:44px;height:44px;border-radius:50%;border:none;font-size:18px;cursor:pointer;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
.dark-toggle{bottom:20px;left:20px;background:#fff;color:#333;border:1px solid #e5e7eb}
.back-top{bottom:20px;right:20px;background:#fff;color:#333;border:1px solid #e5e7eb;display:none}
body.dark{background:#111827;color:#d1d5db}
body.dark .navbar{background:#1f2937;border-color:#374151}
body.dark .logo{color:#60a5fa}
body.dark .nav-links a{color:#9ca3af}
body.dark .nav-links a:hover{color:#60a5fa}
body.dark .card{background:#1f2937;border-color:#374151}
body.dark .card h2{color:#f3f4f6}
body.dark .card p{color:#9ca3af}
body.dark .hero h1{color:#f3f4f6}
body.dark .hero .subtitle{color:#9ca3af}
body.dark .clock-big{color:#60a5fa}
body.dark .clock-date{color:#6b7280}
body.dark .tag{background:#1e3a5f;color:#60a5fa}
body.dark .link-item{background:#111827;color:#d1d5db}
body.dark .link-item:hover{background:#1e3a5f}
body.dark input,body.dark textarea{background:#374151;border-color:#4b5563;color:#d1d5db}
body.dark .list-item{background:#111827}
body.dark .todo-row{border-color:#374151}
body.dark .todo-text{color:#d1d5db}
body.dark .dark-toggle{background:#374151;color:#d1d5db;border-color:#4b5563}
body.dark .back-top{background:#374151;color:#d1d5db;border-color:#4b5563}
.footer{text-align:center;padding:30px 20px;color:#9ca3af;font-size:13px}
@media(max-width:600px){
.nav-links{display:none}
.menu-toggle{display:block}
.link-grid{grid-template-columns:repeat(2,1fr)}
.hero{padding:40px 16px 30px}
.clock-big{font-size:28px}
.main{padding:20px 16px}
}
</style>
</head>
<body>
<nav class="navbar">
<div class="nav-container">
<a href="#home" class="logo">小希的小站</a>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="nav-links" id="navLinks">
<a href="#about">关于我</a>
<a href="#blog">博客</a>
<a href="#diary">日记</a>
<a href="#todo">待办</a>
<a href="#message">留言</a>
</div>
</div>
</nav>

<div class="main">
<section class="hero" id="home">
<img src="avatar.jpg" alt="头像">
<h1>你好，我是小希</h1>
<p class="subtitle">二年级学生 · 记录学习与生活</p>
<div class="clock-date" id="clockDate">----年--月--日 星期-</div>
<div class="clock-big" id="clockBig">--:--:--</div>
</section>

<div class="card" id="about">
<h2>👋 关于我</h2>
<p>你好，我是小希，一名二年级学生。喜欢玩游戏、看书、踢足球，还有陪着我的小狗球球。这个网站是我自己学着做的，用来记录每天的生活和学到的东西。</p>
<div class="tags">
<span class="tag">🎮 玩游戏</span>
<span class="tag">📚 看书</span>
<span class="tag">⚽ 踢足球</span>
<span class="tag">🐶 陪球球</span>
<span class="tag">🎵 听音乐</span>
</div>
</div>

<div class="card" id="blog">
<h2>📝 我的博客</h2>
<input type="text" id="blogTitle" placeholder="文章标题...">
<input type="text" id="blogCategory" placeholder="分类（如：游戏/日常/学习）">
<textarea id="blogContent" placeholder="写点什么..."></textarea>
<button class="btn" onclick="saveBlog()">发布文章</button>
<div id="blogList" style="margin-top:15px"></div>
</div>

<div class="card" id="diary">
<h2>📔 我的日记</h2>
<textarea id="diaryInput" placeholder="记录今天发生的事情..."></textarea>
<button class="btn" onclick="saveDiary()">保存日记</button>
<div id="diaryList" style="margin-top:15px"></div>
</div>

<div class="card" id="todo">
<h2>✅ 今日待办</h2>
<input type="text" id="todoInput" placeholder="要做点什么？按回车添加">
<button class="btn" onclick="addTodo()">添加</button>
<div id="todoList" style="margin-top:10px"></div>
</div>

<div class="card" id="links">
<h2>🔗 常用网站</h2>
<div class="link-grid">
<a href="https://www.bilibili.com" target="_blank" class="link-item"><span class="icon">📺</span><span>B站</span></a>
<a href="https://music.163.com" target="_blank" class="link-item"><span class="icon">🎧</span><span>网易云</span></a>
<a href="https://www.doubao.com" target="_blank" class="link-item"><span class="icon">🤖</span><span>豆包</span></a>
<a href="https://www.douyin.com" target="_blank" class="link-item"><span class="icon">🎵</span><span>抖音</span></a>
<a href="https://www.xiaohongshu.com" target="_blank" class="link-item"><span class="icon">📕</span><span>小红书</span></a>
<a href="https://www.baidu.com" target="_blank" class="link-item"><span class="icon">🔍</span><span>百度</span></a>
</div>
</div>

<div class="card" id="message">
<h2>💬 留言板</h2>
<p style="font-size:13px;color:#6b7280;margin-bottom:12px">欢迎给我留言！</p>
<div class="giscus"></div>
</div>
</div>

<footer class="footer">
© 2026 小希的小站 · 用 ❤️ 制作
</footer>

<button class="fab dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
<button class="fab back-top" onclick="scrollToTop()" id="backTop">↑</button>

<script>
function updateTime(){
const now=new Date();
const h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0');
document.getElementById('clockBig').textContent=h+':'+m+':'+s;
const weeks=['日','一','二','三','四','五','六'];
document.getElementById('clockDate').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+weeks[now.getDay()];
}
updateTime();setInterval(updateTime,1000);

function toggleDark(){
document.body.classList.toggle('dark');
const isDark=document.body.classList.contains('dark');
localStorage.setItem('darkMode',isDark?'1':'0');
document.getElementById('darkBtn').textContent=isDark?'☀️':'🌙';
}
if(localStorage.getItem('darkMode')==='1'){
document.body.classList.add('dark');
document.getElementById('darkBtn').textContent='☀️';
}

function toggleMenu(){
document.getElementById('navLinks').classList.toggle('active');
}

window.addEventListener('scroll',()=>{
document.getElementById('backTop').style.display=window.scrollY>300?'flex':'none';
});
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}

function saveBlog(){
const title=document.getElementById('blogTitle').value.trim();
const content=document.getElementById('blogContent').value.trim();
const category=document.getElementById('blogCategory').value.trim()||'未分类';
if(!title||!content){alert('标题和内容都要写哦！');return;}
let b=JSON.parse(localStorage.getItem('blogs')||'[]');
const now=new Date();
b.unshift({title,content,category,date:now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate()});
localStorage.setItem('blogs',JSON.stringify(b));
document.getElementById('blogTitle').value='';
document.getElementById('blogContent').value='';
document.getElementById('blogCategory').value='';
renderBlogs();
alert('发布成功！');
}
function renderBlogs(){
const b=JSON.parse(localStorage.getItem('blogs')||'[]');
const el=document.getElementById('blogList');
if(b.length===0){el.innerHTML='<p style="color:#9ca3af;font-size:13px">还没有文章，写第一篇吧！</p>';return;}
el.innerHTML=b.map((item,i)=>'<div class="list-item"><div class="date">📰 '+item.title+' · '+item.date+'</div><div class="text">'+item.content+'</div></div>').join('');
}
renderBlogs();

function saveDiary(){
const text=document.getElementById('diaryInput').value.trim();
if(!text){alert('先写点内容再保存哦！');return;}
let d=JSON.parse(localStorage.getItem('diaries')||'[]');
const now=new Date();
d.unshift({date:now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate(),text});
localStorage.setItem('diaries',JSON.stringify(d));
document.getElementById('diaryInput').value='';
renderDiaries();
alert('保存成功！');
}
function renderDiaries(){
const d=JSON.parse(localStorage.getItem('diaries')||'[]');
const el=document.getElementById('diaryList');
if(d.length===0){el.innerHTML='<p style="color:#9ca3af;font-size:13px">还没有日记，快写第一篇吧！</p>';return;}
el.innerHTML=d.map((item,i)=>'<div class="list-item"><div class="date">📔 '+item.date+'</div><div class="text">'+item.text+'</div></div>').join('');
}
renderDiaries();

function addTodo(){
const inp=document.getElementById('todoInput');
const v=inp.value.trim();
if(!v)return;
let t=JSON.parse(localStorage.getItem('todos')||'[]');
t.push({text:v,done:false});
localStorage.setItem('todos',JSON.stringify(t));
inp.value='';
renderTodos();
}
function toggleTodo(i){
let t=JSON.parse(localStorage.getItem('todos')||'[]');
t[i].done=!t[i].done;
localStorage.setItem('todos',JSON.stringify(t));
renderTodos();
}
function deleteTodo(i){
let t=JSON.parse(localStorage.getItem('todos')||'[]');
t.splice(i,1);
localStorage.setItem('todos',JSON.stringify(t));
renderTodos();
}
function renderTodos(){
let t=JSON.parse(localStorage.getItem('todos')||'[]');
const el=document.getElementById('todoList');
if(t.length===0){el.innerHTML='<p style="color:#9ca3af;font-size:13px">还没有待办，加一条试试～</p>';return;}
el.innerHTML=t.map((x,i)=>'<div class="todo-row'+(x.done?' todo-done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleTodo('+i+')"><span class="todo-text">'+x.text+'</span><button class="todo-del" onclick="deleteTodo('+i+')">×</button></div>').join('');
}
document.getElementById('todoInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTodo();});
renderTodos();

(function(){
const s=document.createElement('script');
s.src='https://giscus.app/client.js';
s.setAttribute('data-repo','596012613lzq-afk/my-website');
s.setAttribute('data-repo-id','R_kgDOVf0ndQ');
s.setAttribute('data-category','Announcements');
s.setAttribute('data-category-id','DIC_kwDOVf0ndc4DKbxK');
s.setAttribute('data-mapping','pathname');
s.setAttribute('data-strict','0');
s.setAttribute('data-reactions-enabled','1');
s.setAttribute('data-emit-metadata','0');
s.setAttribute('data-input-position','bottom');
s.setAttribute('data-theme','preferred_color_scheme');
s.setAttribute('data-lang','zh-CN');
s.crossOrigin='anonymous';
s.async=true;
document.querySelector('.giscus').appendChild(s);
})();
</script>
</body>
</html>
