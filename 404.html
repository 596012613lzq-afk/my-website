<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>404 - 页面走丢了 | 老头的小站</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #0a0e17; color: #e0e6ed; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center;
        }
        .container { max-width: 400px; padding: 40px; }
        .emoji { font-size: 80px; margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        h1 { font-size: 48px; color: #00d4ff; margin-bottom: 10px; }
        p { color: #8892b0; margin-bottom: 25px; line-height: 1.6; }
        a {
            display: inline-block; background: #00d4ff; color: #0a0e17; padding: 12px 30px;
            border-radius: 25px; text-decoration: none; font-weight: 600; font-size: 14px;
            transition: all 0.3s;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,212,255,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🐶</div>
        <h1>404</h1>
        <p>球球把这个页面叼走了！<br>你要找的地方不存在，快回家吧～</p>
        <a href="/my-website/">🏠 回到首页</a>
    </div>
</body>
</html>
